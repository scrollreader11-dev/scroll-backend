<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Friends' Games – ScrollHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--surface:#161920;--card:#1c2029;--border:#272c3a;
  --accent:#6c63ff;--accent2:#ff6b6b;--text:#e8eaf0;--muted:#8890a4;
  --radius:10px;--thumb-h:148px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:inherit;text-decoration:none}

/* ── header ── */
header{
  background:linear-gradient(135deg,#1a1040 0%,#0d0f14 60%);
  border-bottom:1px solid var(--border);
  padding:28px 20px 20px;
  text-align:center;
  position:sticky;top:0;z-index:100;
}
header h1{font-size:1.5rem;font-weight:700;letter-spacing:.02em}
header h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:.82rem;margin-top:3px}

/* ── controls ── */
#controls{
  max-width:1200px;margin:0 auto;
  padding:16px 16px 0;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
#search{
  flex:1;min-width:200px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.9rem;
  padding:9px 14px;outline:none;
  transition:border-color .15s;
}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
#count{color:var(--muted);font-size:.82rem;white-space:nowrap;padding:0 4px}

/* ── tags ── */
#tags{
  max-width:1200px;margin:0 auto;
  padding:10px 16px;
  display:flex;flex-wrap:wrap;gap:6px;
}
.tag-btn{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;font-size:.75rem;
  cursor:pointer;transition:all .12s;color:var(--muted);
}
.tag-btn:hover{border-color:var(--accent);color:var(--text)}
.tag-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── grid ── */
#grid{
  max-width:1200px;margin:0 auto;
  padding:12px 16px 48px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .12s,border-color .12s,box-shadow .12s;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-3px);
  border-color:var(--accent);
  box-shadow:0 6px 24px rgba(108,99,255,.2);
}
.card:hover .play-overlay{opacity:1}
.thumb-wrap{position:relative;height:var(--thumb-h);background:#111;overflow:hidden}
.thumb-wrap img{
  width:100%;height:100%;object-fit:cover;
  display:block;transition:transform .2s;
}
.card:hover .thumb-wrap img{transform:scale(1.04)}
.play-overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
.play-overlay svg{width:40px;height:40px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.card-info{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:4px}
.card-title{font-size:.8rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:3px}
.card-tag{font-size:.65rem;color:var(--muted);background:var(--surface);
  border-radius:4px;padding:1px 5px}

/* ── empty ── */
#empty{
  display:none;text-align:center;padding:60px 20px;color:var(--muted);
  grid-column:1/-1;font-size:.95rem;
}

/* ── scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:480px){
  :root{--thumb-h:120px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
}
</style>
</head>

const TAGS = [...new Set(GAMES.flatMap(g=>g.tags))].sort();

// build tag buttons
const tagContainer = document.getElementById('tags');
TAGS.forEach(t=>{
  const b=document.createElement('button');
  b.className='tag-btn'; b.dataset.tag=t; b.textContent=t;
  tagContainer.appendChild(b);
});

let activeTag='', query='';

function render(){
  const grid=document.getElementById('grid');
  const countEl=document.getElementById('count');
  const empty=document.getElementById('empty');
  const q=query.trim().toLowerCase();
  const filtered=GAMES.filter(g=>{
    const matchTag=!activeTag||g.tags.includes(activeTag);
    const matchQ=!q||g.title.toLowerCase().includes(q)||g.tags.some(t=>t.toLowerCase().includes(q));
    return matchTag&&matchQ;
  });
  countEl.textContent=filtered.length+' game'+(filtered.length===1?'':'s');
  // remove old cards
  [...grid.querySelectorAll('.card')].forEach(c=>c.remove());
  empty.style.display=filtered.length?'none':'block';
  const frag=document.createDocumentFragment();
  filtered.forEach(g=>{
    const card=document.createElement('a');
    card.className='card'; card.href=g.url; card.title=g.desc||g.title;
    card.innerHTML=`
      <div class="thumb-wrap">
        <img src="${g.img}" alt="${g.title}" loading="lazy" onerror="this.src='/storage/images/main/unknown.jpg'"/>
        <div class="play-overlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="card-info">
        <div class="card-title">${g.title}</div>
        <div class="card-tags">${g.tags.slice(0,3).map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
      </div>`;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

// events
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});
document.getElementById('tags').addEventListener('click',e=>{
  const btn=e.target.closest('.tag-btn');
  if(!btn)return;
  activeTag=btn.dataset.tag;
  document.querySelectorAll('.tag-btn').forEach(b=>b.classList.toggle('active',b===btn));
  render();
});

render();
</script>
