<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #err { display: none; color: #fff; font-family: sans-serif; padding: 24px; }
  </style>
</head>
<body>
<iframe id="frame" allowfullscreen allow="autoplay; fullscreen *"></iframe>
<div id="err"></div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const url = params.get('url');
  if (!url) { showErr('No URL provided.'); return; }

  let html = '';
  try {
    // jsDelivr supports CORS so this fetch works cross-origin
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    // Google Gadget / OpenSocial format: extract HTML from <Content><![CDATA[...]]>
    const cdataMatch = text.match(/<Content[^>]*type=["']html["'][^>]*>\s*<!\[CDATA\[([\s\S]*?)\]\]>/i)
                    || text.match(/<!\[CDATA\[([\s\S]*?)\]\]>/i);

    if (cdataMatch) {
      html = cdataMatch[1].trim();
    } else if (/^\s*<!DOCTYPE|^\s*<html/i.test(text)) {
      // Already plain HTML — load directly
      document.getElementById('frame').src = url;
      return;
    } else {
      throw new Error('Unknown format');
    }
  } catch (e) {
    // Network / CORS fallback: just load the URL directly in the iframe
    document.getElementById('frame').src = url;
    return;
  }

  // Render extracted HTML as a blob URL so scripts and Flash (via Ruffle) work
  try {
    const blob = new Blob([html], { type: 'text/html' });
    const blobUrl = URL.createObjectURL(blob);
    document.getElementById('frame').src = blobUrl;
  } catch (e) {
    showErr('Could not render game: ' + e.message);
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
  }
})();
</script>
</body>
</html>
