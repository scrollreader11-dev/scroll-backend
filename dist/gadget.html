<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #err { display: none; color: #fff; font-family: sans-serif; padding: 24px; }
  </style>
</head>
<body>
<iframe id="frame" allowfullscreen allow="autoplay; fullscreen *"></iframe>
<div id="err"></div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const url = params.get('url');
  if (!url) { showErr('No URL provided.'); return; }

  // Backend URL — where /cdn-proxy/ lives.
  // Hardcoded so it works even when gadget.html is served from a different domain.
  const BACKEND = 'https://scrollhub-acvy.onrender.com';
  const cdnProxyBase = BACKEND + '/cdn-proxy/';
  const CDN_HOSTS = ['cdn.jsdelivr.net', 'unpkg.com', 'cdnjs.cloudflare.com', 'raw.githubusercontent.com'];
  const CDN_RE = /https?:\/\/(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|raw\.githubusercontent\.com)\//g;

  function proxyUrl(u) {
    try {
      const p = new URL(u);
      if (CDN_HOSTS.includes(p.hostname)) {
        return cdnProxyBase + p.hostname + p.pathname + (p.search || '');
      }
    } catch (e) {}
    return u;
  }

  // Try direct CDN fetch first (5s timeout — instant on open networks).
  // Fall back to backend proxy if direct is blocked (school networks).
  async function fetchWithFallback(rawUrl) {
    try {
      const ac = new AbortController();
      const t = setTimeout(() => { try { ac.abort(); } catch (e) {} }, 5000);
      let r;
      try { r = await fetch(rawUrl, { cache: 'force-cache', signal: ac.signal }); }
      finally { clearTimeout(t); }
      if (r && r.ok) return r;
    } catch (e) { /* timed out or blocked */ }

    // Proxy fallback
    const proxied = proxyUrl(rawUrl);
    if (proxied === rawUrl) return null;
    try {
      const r2 = await fetch(proxied, { cache: 'force-cache' });
      if (r2.ok) return r2;
    } catch (e) {}
    return null;
  }

  let html = '';
  try {
    const res = await fetchWithFallback(url);
    if (!res) throw new Error('fetch failed');
    const text = await res.text();

    // ── 1) Google Gadget / OpenSocial: <Content type="html"><![CDATA[...]]> ──
    const cdataMatch = text.match(/<Content[^>]*type=["']html["'][^>]*>\s*<!\[CDATA\[([\s\S]*?)\]\]>/i)
                    || text.match(/<!\[CDATA\[([\s\S]*?)\]\]>/i);
    if (cdataMatch) {
      html = cdataMatch[1].trim();

    // ── 2) Plain HTML ──
    } else if (/^\s*<!DOCTYPE|^\s*<html/i.test(text)) {
      html = text;

    // ── 3) XML wrapper without CDATA ──
    } else {
      const htmlStart = text.search(/<!DOCTYPE\s+html|<html[\s>]/i);
      if (htmlStart >= 0) {
        html = text.slice(htmlStart);
      } else {
        document.getElementById('frame').src = proxyUrl(url);
        return;
      }
    }
  } catch (e) {
    document.getElementById('frame').src = proxyUrl(url);
    return;
  }

  // ── Flash (.swf) detection: build a proper Ruffle wrapper ──────────────────
  // The game HTML may already try to load Ruffle from a broken CDN repo.
  // We replace the whole thing with a clean wrapper using the official package.
  const swfMatch = html.match(/(?:src|value)=['"]((?:https?:)?\/\/[^'"]+\.swf(?:\?[^'"]*)?)['"]/i)
                || html.match(/(https?:\/\/[^"'\s]+\.swf)/i);
  if (swfMatch) {
    let swfUrl = swfMatch[1];
    // Make sure it's absolute
    if (swfUrl.startsWith('//')) swfUrl = 'https:' + swfUrl;
    // Load Ruffle directly from the official CDN (NOT through the proxy).
    // The blob iframe can fetch unpkg.com directly (ACAO: *), and routing
    // Ruffle through Render would break if Render is sleeping.
    // We also keep the original SWF URL — jsDelivr has ACAO:* so the blob
    // context can load the SWF directly without the proxy.
    const ruffleUrl = 'https://unpkg.com/@ruffle-rs/ruffle';
    // ⚠️  IMPORTANT: use \x3c/script> (NOT <\/script>) inside this template
    // literal. The HTML parser is not JS-aware; it closes the outer script
    // tag at the first <\/script> sequence it sees in the source, causing a
    // SyntaxError that breaks ALL game loading. \x3c evaluates to '<' in JS
    // so the generated blob HTML still gets correct closing tags.
    html = `<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#000;overflow:hidden}</style>
<script src="${ruffleUrl}">\x3c/script>
</head><body>
<script>
window.addEventListener('load', async () => {
  if (!window.RufflePlayer || !window.RufflePlayer.newest) {
    document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:20px">Flash requires Ruffle, but Ruffle failed to load. Try refreshing the page.</p>';
    return;
  }
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.cssText = 'width:100%;height:100%;position:absolute;top:0;left:0';
  document.body.appendChild(player);
  try {
    await player.load(${JSON.stringify(swfUrl)});
  } catch(e) {
    document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:20px">Flash game failed to load: ' + e.message + '</p>';
  }
});
\x3c/script>
</body></html>`;

    const blob = new Blob([html], { type: 'text/html' });
    document.getElementById('frame').src = URL.createObjectURL(blob);
    return;
  }

  // ── Non-Flash: rewrite CDN URLs to go through backend proxy ────────────────
  // _pv=2 busts any browser-cached proxy responses from before the
  // Content-Length fix (the proxy used to forward the compressed size,
  // truncating decompressed JS to half its length).
  html = html.replace(
    /https?:\/\/(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|raw\.githubusercontent\.com)(\/[^"'\s]*)/g,
    (_, host, path) => {
      const sep = path.includes('?') ? '&' : '?';
      return cdnProxyBase + host + path + sep + '_pv=2';
    }
  );

  // Render via blob so MIME type is always text/html regardless of CDN headers.
  try {
    const blob = new Blob([html], { type: 'text/html' });
    document.getElementById('frame').src = URL.createObjectURL(blob);
  } catch (e) {
    showErr('Could not render game: ' + e.message);
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
  }
})();
</script>
</body>
</html>
