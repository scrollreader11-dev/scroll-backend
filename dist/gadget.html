<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #err { display: none; color: #fff; font-family: sans-serif; padding: 24px; }
  </style>
</head>
<body>
<iframe id="frame" allowfullscreen allow="autoplay; fullscreen *"></iframe>
<div id="err"></div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const url = params.get('url');
  if (!url) { showErr('No URL provided.'); return; }

  let html = '';
  try {
    const res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    // ── 1) Google Gadget / OpenSocial: <Content type="html"><![CDATA[...]]> ──
    const cdataMatch = text.match(/<Content[^>]*type=["']html["'][^>]*>\s*<!\[CDATA\[([\s\S]*?)\]\]>/i)
                    || text.match(/<!\[CDATA\[([\s\S]*?)\]\]>/i);
    if (cdataMatch) {
      html = cdataMatch[1].trim();

    // ── 2) Plain HTML file (may be served with wrong MIME by CDN) ──
    } else if (/^\s*<!DOCTYPE|^\s*<html/i.test(text)) {
      html = text;

    // ── 3) XML wrapper without CDATA (e.g. <Module>…<!DOCTYPE html>…</Module>) ──
    } else {
      const htmlStart = text.search(/<!DOCTYPE\s+html|<html[\s>]/i);
      if (htmlStart >= 0) {
        html = text.slice(htmlStart);
      } else {
        // Nothing parseable — last-resort direct load
        document.getElementById('frame').src = url;
        return;
      }
    }
  } catch (e) {
    // Network / CORS failure → try direct load
    document.getElementById('frame').src = url;
    return;
  }

  // Rewrite CDN URLs to go through our server-side proxy so game assets
  // load even when the CDN is blocked on the user's network (e.g. school).
  // We use the server origin (location.origin) so the URLs are absolute and
  // resolve correctly from inside the blob URL context.
  const cdnProxyBase = location.origin + '/cdn-proxy/';
  const CDN_RE = /https?:\/\/(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com)\//g;
  html = html.replace(CDN_RE, (m, host) => cdnProxyBase + host + '/');

  // Always render as a blob so the browser treats content as text/html
  // regardless of whatever Content-Type the CDN originally sent.
  try {
    const blob = new Blob([html], { type: 'text/html' });
    document.getElementById('frame').src = URL.createObjectURL(blob);
  } catch (e) {
    showErr('Could not render game: ' + e.message);
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
  }
})();
</script>
</body>
</html>
