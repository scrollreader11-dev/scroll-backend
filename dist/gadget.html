<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #err { display: none; color: #fff; font-family: sans-serif; padding: 24px; }
  </style>
</head>
<body>
<iframe id="frame" allowfullscreen allow="autoplay; fullscreen *"></iframe>
<div id="err"></div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const url = params.get('url');
  if (!url) { showErr('No URL provided.'); return; }

  // Hardcoded backend URL — this is where /cdn-proxy/ lives.
  // Using location.origin breaks when gadget.html is served from a different
  // domain (e.g. Firebase Hosting) than the backend.
  const BACKEND = 'https://scrollhub-acvy.onrender.com';
  const cdnProxyBase = BACKEND + '/cdn-proxy/';
  const CDN_HOSTS = ['cdn.jsdelivr.net', 'unpkg.com', 'cdnjs.cloudflare.com', 'raw.githubusercontent.com'];

  function proxyUrl(u) {
    try {
      const p = new URL(u);
      if (CDN_HOSTS.includes(p.hostname)) {
        return cdnProxyBase + p.hostname + p.pathname + (p.search || '');
      }
    } catch (e) {}
    return u;
  }

  // Fetch helper: try direct first (5s timeout), fall back to proxy.
  // - At home / open networks: direct CDN fetch is instant.
  // - At school (CDN blocked): direct times out quickly, proxy takes over.
  async function fetchWithFallback(rawUrl) {
    // 1) Try direct with a short timeout
    try {
      const ac = new AbortController();
      const t = setTimeout(() => { try { ac.abort(); } catch (e) {} }, 5000);
      let r;
      try { r = await fetch(rawUrl, { cache: 'force-cache', signal: ac.signal }); }
      finally { clearTimeout(t); }
      if (r.ok) return r;
    } catch (e) { /* timed out or blocked — fall through to proxy */ }

    // 2) Try via server-side CDN proxy
    const proxied = proxyUrl(rawUrl);
    if (proxied === rawUrl) return null; // not a CDN URL, nothing to proxy
    const r2 = await fetch(proxied, { cache: 'force-cache' });
    if (r2.ok) return r2;
    return null;
  }

  let html = '';
  try {
    const res = await fetchWithFallback(url);
    if (!res) throw new Error('fetch failed');
    const text = await res.text();

    // ── 1) Google Gadget / OpenSocial: <Content type="html"><![CDATA[...]]> ──
    const cdataMatch = text.match(/<Content[^>]*type=["']html["'][^>]*>\s*<!\[CDATA\[([\s\S]*?)\]\]>/i)
                    || text.match(/<!\[CDATA\[([\s\S]*?)\]\]>/i);
    if (cdataMatch) {
      html = cdataMatch[1].trim();

    // ── 2) Plain HTML file (may be served with wrong MIME by CDN) ──
    } else if (/^\s*<!DOCTYPE|^\s*<html/i.test(text)) {
      html = text;

    // ── 3) XML wrapper without CDATA (e.g. <Module>…<!DOCTYPE html>…</Module>) ──
    } else {
      const htmlStart = text.search(/<!DOCTYPE\s+html|<html[\s>]/i);
      if (htmlStart >= 0) {
        html = text.slice(htmlStart);
      } else {
        // Nothing parseable — try loading as a plain iframe via proxy
        document.getElementById('frame').src = proxyUrl(url);
        return;
      }
    }
  } catch (e) {
    // All fetch attempts failed — last resort: load via proxy as plain iframe
    document.getElementById('frame').src = proxyUrl(url);
    return;
  }

  // Rewrite CDN URLs inside the game HTML so assets (Unity bundles, JS, etc.)
  // also go through the backend proxy — bypassing school network CDN blocks.
  const CDN_RE = /https?:\/\/(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|raw\.githubusercontent\.com)\//g;
  html = html.replace(CDN_RE, (m, host) => cdnProxyBase + host + '/');

  // Always render via blob URL so the browser treats content as text/html
  // regardless of whatever Content-Type the CDN originally served.
  try {
    const blob = new Blob([html], { type: 'text/html' });
    document.getElementById('frame').src = URL.createObjectURL(blob);
  } catch (e) {
    showErr('Could not render game: ' + e.message);
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
  }
})();
</script>
</body>
</html>
