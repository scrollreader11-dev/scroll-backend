<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer background gradient -->
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#2a1650"/>
      <stop offset="60%" style="stop-color:#13092a"/>
      <stop offset="100%" style="stop-color:#080412"/>
    </radialGradient>

    <!-- Scroll body parchment -->
    <linearGradient id="parchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22103d"/>
      <stop offset="40%" style="stop-color:#1c0e35"/>
      <stop offset="100%" style="stop-color:#150b28"/>
    </linearGradient>

    <!-- Scroll body highlight (left side light) -->
    <linearGradient id="parchHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b72d4;stop-opacity:0.12"/>
      <stop offset="25%" style="stop-color:#7c5cbf;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#3a2060;stop-opacity:0.08"/>
    </linearGradient>

    <!-- Top roll gradient -->
    <linearGradient id="rollTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4aaff"/>
      <stop offset="18%" style="stop-color:#a878e8"/>
      <stop offset="50%" style="stop-color:#7c5cbf"/>
      <stop offset="78%" style="stop-color:#5a3d99"/>
      <stop offset="100%" style="stop-color:#3d2475"/>
    </linearGradient>

    <!-- Top roll underside (darker) -->
    <linearGradient id="rollTopUnder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2475"/>
      <stop offset="100%" style="stop-color:#241455"/>
    </linearGradient>

    <!-- Bottom roll gradient -->
    <linearGradient id="rollBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a878e8"/>
      <stop offset="35%" style="stop-color:#7c5cbf"/>
      <stop offset="70%" style="stop-color:#5a3d99"/>
      <stop offset="100%" style="stop-color:#3d2475"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="40%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#a07000"/>
    </linearGradient>

    <!-- Wax seal gradient -->
    <radialGradient id="sealGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" style="stop-color:#c040d0"/>
      <stop offset="50%" style="stop-color:#8a20b0"/>
      <stop offset="100%" style="stop-color:#5a1080"/>
    </radialGradient>

    <!-- Wax seal edge -->
    <radialGradient id="sealEdge" cx="50%" cy="50%" r="50%">
      <stop offset="70%" style="stop-color:#00000000"/>
      <stop offset="100%" style="stop-color:#00000055"/>
    </radialGradient>

    <!-- Glow line gradient (text lines on scroll) -->
    <linearGradient id="glowLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b72d4;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#c4a0f0;stop-opacity:0.9"/>
      <stop offset="80%" style="stop-color:#c4a0f0;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#9b72d4;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glowLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b72d4;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#b090e8;stop-opacity:0.7"/>
      <stop offset="75%" style="stop-color:#b090e8;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#9b72d4;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glowLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b72d4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#a080d8;stop-opacity:0.5"/>
      <stop offset="70%" style="stop-color:#a080d8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#9b72d4;stop-opacity:0"/>
    </linearGradient>

    <!-- Ambient outer glow -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c5cbf" flood-opacity="0.5"/>
    </filter>
    <filter id="sealShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="rollShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Clip to circle -->
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="94"/>
    </clipPath>

    <!-- Sparkle shape -->
    <symbol id="sparkle" viewBox="-4 -4 8 8">
      <polygon points="0,-3.5 0.6,-0.6 3.5,0 0.6,0.6 0,3.5 -0.6,0.6 -3.5,0 -0.6,-0.6" fill="white"/>
    </symbol>
  </defs>

  <!-- ── BACKGROUND ── -->
  <circle cx="100" cy="100" r="98" fill="#080412" opacity="0.6"/>
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>

  <!-- Subtle inner cosmic texture rings -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#7c5cbf" stroke-width="0.4" opacity="0.15"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#9b72d4" stroke-width="0.3" opacity="0.1"/>

  <!-- ── STAR PARTICLES ── -->
  <!-- Tiny sparkle stars -->
  <circle cx="28" cy="32" r="1.2" fill="#e0d0ff" opacity="0.8" filter="url(#tinyGlow)"/>
  <circle cx="168" cy="40" r="0.9" fill="#c4a0f0" opacity="0.7"/>
  <circle cx="174" cy="155" r="1.1" fill="#e0d0ff" opacity="0.6" filter="url(#tinyGlow)"/>
  <circle cx="24" cy="162" r="0.8" fill="#b090e8" opacity="0.5"/>
  <circle cx="48" cy="18" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="155" cy="22" r="1.0" fill="#e0d0ff" opacity="0.6"/>
  <circle cx="180" cy="88" r="0.8" fill="#c4a0f0" opacity="0.4"/>
  <circle cx="20" cy="95" r="0.9" fill="#d0b8ff" opacity="0.5"/>
  <circle cx="62" cy="185" r="0.7" fill="#c4a0f0" opacity="0.4"/>
  <circle cx="140" cy="182" r="0.9" fill="#d0b8ff" opacity="0.5"/>

  <!-- Four-pointed sparkle stars -->
  <use href="#sparkle" x="35" y="48" width="7" height="7" fill="#d0b0ff" opacity="0.6" filter="url(#tinyGlow)"/>
  <use href="#sparkle" x="162" y="52" width="6" height="6" fill="#e0c8ff" opacity="0.5" filter="url(#tinyGlow)"/>
  <use href="#sparkle" x="163" y="145" width="8" height="8" fill="#c4a0f0" opacity="0.6" filter="url(#tinyGlow)"/>
  <use href="#sparkle" x="30" y="148" width="6" height="6" fill="#d0b8ff" opacity="0.5" filter="url(#tinyGlow)"/>
  <use href="#sparkle" x="100" y="15" width="6" height="6" fill="#e0d0ff" opacity="0.4" filter="url(#tinyGlow)"/>

  <!-- ── SCROLL SHADOW (depth layer) ── -->
  <ellipse cx="101" cy="162" rx="58" ry="9" fill="#000" opacity="0.55"/>
  <ellipse cx="101" cy="46" rx="58" ry="7" fill="#000" opacity="0.3"/>

  <!-- ── SCROLL MAIN BODY ── -->
  <rect x="41" y="47" width="118" height="112" rx="2" fill="url(#parchGrad)" filter="url(#dropShadow)"/>
  <!-- Parchment edge borders -->
  <rect x="41" y="47" width="118" height="112" rx="2" fill="none" stroke="#5a3d99" stroke-width="1.2" opacity="0.5"/>
  <!-- Left light stripe (3D illusion) -->
  <rect x="41" y="47" width="118" height="112" rx="2" fill="url(#parchHighlight)"/>
  <!-- Vertical faint center fold line -->
  <line x1="100" y1="47" x2="100" y2="159" stroke="#7c5cbf" stroke-width="0.4" opacity="0.15"/>

  <!-- ── SCROLL TEXT LINES ── -->
  <!-- Line 1 — bright, top -->
  <rect x="57" y="64" width="86" height="2.5" rx="1.2" fill="url(#glowLine1)" filter="url(#tinyGlow)"/>
  <!-- Line 2 -->
  <rect x="57" y="76" width="86" height="2.5" rx="1.2" fill="url(#glowLine1)"/>
  <!-- Line 3 — shorter -->
  <rect x="57" y="88" width="64" height="2" rx="1" fill="url(#glowLine2)"/>
  <!-- Separator hairline -->
  <line x1="57" y1="100" x2="143" y2="100" stroke="#6040a0" stroke-width="0.6" opacity="0.5"/>
  <!-- Lines below separator -->
  <rect x="57" y="109" width="86" height="2" rx="1" fill="url(#glowLine2)"/>
  <rect x="57" y="119" width="72" height="2" rx="1" fill="url(#glowLine3)"/>
  <rect x="57" y="129" width="50" height="1.5" rx="0.8" fill="url(#glowLine3)"/>

  <!-- ── WAX SEAL ── -->
  <!-- Outer drip shadows -->
  <ellipse cx="100.5" cy="101.5" rx="19" ry="19" fill="#000" opacity="0.45"/>
  <!-- Seal body -->
  <circle cx="100" cy="100" r="19" fill="url(#sealGrad)" filter="url(#sealShadow)"/>
  <!-- Seal edge darken -->
  <circle cx="100" cy="100" r="19" fill="url(#sealEdge)"/>
  <!-- Seal inner ring -->
  <circle cx="100" cy="100" r="16" fill="none" stroke="#e080ff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="100" cy="100" r="13" fill="none" stroke="#d060f0" stroke-width="0.4" opacity="0.3"/>
  <!-- Seal shine -->
  <ellipse cx="95" cy="94" rx="6" ry="4" fill="#ffffff" opacity="0.12" transform="rotate(-25 95 94)"/>
  <!-- "S" on seal -->
  <text x="100" y="106"
        font-family="Georgia,'Times New Roman',serif"
        font-size="20" font-weight="bold"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#softGlow)"
        opacity="0.95">S</text>

  <!-- ── TOP ROLL ── -->
  <!-- Top roll underside shadow strip -->
  <rect x="41" y="53" width="118" height="6" fill="url(#rollTopUnder)" opacity="0.7"/>

  <!-- Top roll main cylinder body -->
  <ellipse cx="100" cy="48" rx="59" ry="11" fill="url(#rollTop)" filter="url(#rollShadow)"/>
  <!-- Top roll top-edge highlight (shine) -->
  <ellipse cx="100" cy="42" rx="54" ry="5.5" fill="#e8c8ff" opacity="0.18"/>
  <!-- Top roll bright specular highlight -->
  <ellipse cx="88" cy="42" rx="22" ry="2.5" fill="#ffffff" opacity="0.14"/>
  <!-- Top roll bottom edge (darker crease) -->
  <ellipse cx="100" cy="56" rx="59" ry="6" fill="#3d2475" opacity="0.6"/>
  <!-- End caps left -->
  <ellipse cx="41" cy="48" rx="3" ry="11" fill="#5a3d99" opacity="0.8"/>
  <ellipse cx="41" cy="48" rx="1.5" ry="9" fill="#9b72d4" opacity="0.4"/>
  <!-- End caps right -->
  <ellipse cx="159" cy="48" rx="3" ry="11" fill="#5a3d99" opacity="0.8"/>
  <ellipse cx="159" cy="48" rx="1.5" ry="9" fill="#9b72d4" opacity="0.4"/>
  <!-- Gold bands on roll -->
  <rect x="41" y="42" width="118" height="1.5" rx="0.75" fill="url(#goldGrad)" opacity="0.45"/>
  <rect x="41" y="53" width="118" height="1" rx="0.5" fill="url(#goldGrad)" opacity="0.25"/>

  <!-- ── BOTTOM ROLL ── -->
  <!-- Bottom roll top edge crease -->
  <ellipse cx="100" cy="153" rx="59" ry="6" fill="#3d2475" opacity="0.5"/>
  <!-- Bottom roll main cylinder -->
  <ellipse cx="100" cy="158" rx="59" ry="11" fill="url(#rollBot)" filter="url(#rollShadow)"/>
  <!-- Bottom roll top highlight -->
  <ellipse cx="100" cy="152" rx="55" ry="5" fill="#c4a0f0" opacity="0.2"/>
  <!-- Bottom roll specular shine -->
  <ellipse cx="112" cy="154" rx="18" ry="2" fill="#ffffff" opacity="0.10"/>
  <!-- Bottom roll bottom edge shadow -->
  <ellipse cx="100" cy="167" rx="56" ry="5" fill="#1a0840" opacity="0.7"/>
  <!-- End caps left -->
  <ellipse cx="41" cy="158" rx="3" ry="11" fill="#5a3d99" opacity="0.8"/>
  <ellipse cx="41" cy="158" rx="1.5" ry="9" fill="#9b72d4" opacity="0.4"/>
  <!-- End caps right -->
  <ellipse cx="159" cy="158" rx="3" ry="11" fill="#5a3d99" opacity="0.8"/>
  <ellipse cx="159" cy="158" rx="1.5" ry="9" fill="#9b72d4" opacity="0.4"/>
  <!-- Gold bands on bottom roll -->
  <rect x="41" y="152" width="118" height="1.5" rx="0.75" fill="url(#goldGrad)" opacity="0.4"/>
  <rect x="41" y="163" width="118" height="1" rx="0.5" fill="url(#goldGrad)" opacity="0.2"/>

  <!-- ── OUTER RING & BORDER ── -->
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#7c5cbf" stroke-width="1.2" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#5a3d99" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner glow accents -->
  <circle cx="41" cy="48" r="4" fill="#9b72d4" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="159" cy="48" r="4" fill="#9b72d4" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="41" cy="158" r="4" fill="#7c5cbf" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="159" cy="158" r="4" fill="#7c5cbf" opacity="0.4" filter="url(#softGlow)"/>

  <!-- ── TOP AMBIENT GLOW ── -->
  <ellipse cx="100" cy="48" rx="45" ry="12" fill="#9b72d4" opacity="0.12" filter="url(#outerGlow)"/>
  <ellipse cx="100" cy="158" rx="40" ry="10" fill="#7c5cbf" opacity="0.10" filter="url(#outerGlow)"/>
</svg>
